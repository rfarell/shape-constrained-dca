# Width-diverse ensemble ("arch"; selected on the TRAIN-internal holdout 2026-10-05): five members with prior
# network widths 32/64/128/256/512 on the v2 configuration, fitted on all TRAIN; validation forecasts.
lanes = 2
min_available_gb = 40

[[job]]
label = "bayes_arch"
output = "val_arch_s42"
args = "run --models bayes --device cuda --split validation --set width=256 --set rank=8 --set train_samples=16 --set objective=predictive --set log_every=50 --set epochs=200 --set predictive_samples=32 --set rate_clock=true --set discrepancy=ou_interval --set prior_width=32 --seeds 42"

