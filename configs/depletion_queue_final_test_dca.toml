# Final test: per-well industry DCA (CPU), fitted on all TRAIN.
lanes = 2
min_available_gb = 40

[[job]]
label = "pw_arps_bayes"
output = "test_pw_arps_bayes"
args = "run --models pw_arps_bayes --seeds 42 --device cpu --split test --protocol configs/depletion_final_protocol.toml"

