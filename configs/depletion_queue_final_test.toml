# Final: calibrated validation and one-time test forecasts from the frozen five fits (kappa=1.15, nu=1 chosen on calibration).
lanes = 2
min_available_gb = 40

[[job]]
label = "bayes_cal"
output = "val_bayes_cal_s42"
args = "repredict --model outputs/val_bayes_s42/bayes_final_seed42_model.pt --device cuda --split validation --set report_inflation=1.15"

