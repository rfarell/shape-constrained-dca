# Prespecified before the first validation model scores on 2026-09-07.
# Project decision thresholds, not literature-derived universal standards.
[scope]
primary_metric = "macro_scaled_wis"
interval_levels = [0.80, 0.95]
aggregation = "equal_origin_endpoint_cell_equal_phase"
point_metric = "macro_increment_r2"
point_functional = "predictive_mean"
phase_order = ["oil", "gas", "water"]
final_training_seeds_minimum = 5
selection_split = "validation"
post_selection_correction_split = "calibration"
confirmation_split = "test"
prior_bakken_exposure = true

[practical_gates]
macro_wis_relative_improvement_minimum = 0.05
phase_wis_relative_degradation_maximum = 0.03
macro_r2_absolute_degradation_maximum = 0.02
macro_and_phase_coverage_deficit_maximum = 0.03
paired_group_bootstrap_confidence_level = 0.95
paired_wis_improvement_interval_excludes_zero = true
noninferiority_requires_one_sided_uncertainty_bounds = true
reference = "strongest_fairly_tuned_baseline_selected_on_validation"

[claim_limits]
wis_gain_with_r2_noninferiority = "probabilistic_improvement_with_point_noninferiority"
more_accurate_requires = "positive_point_accuracy_gain_with_group_uncertainty"
sharper_requires = "smaller_width_at_comparable_coverage_with_group_uncertainty"
better_calibrated_requires = "reduced_coverage_error_with_group_uncertainty"
simultaneous_claim_requires = "all_claimed_properties_supported"
latent_calibration = "not_identifiable_from_noisy_canonical_export_alone"
instantaneous_and_post1080 = "model_implied_not_validated"

[publication_gates]
canonical_export_construction_verified = false
static_attribute_units_and_cutoff_availability_verified = false
independent_external_confirmation_available = false
history_masks_are_constructed = true
