# v2 disclosed second look at test (configs/depletion_v2_protocol.toml): five all-TRAIN fits, test forecasts.
lanes = 2
min_available_gb = 40

[[job]]
label = "bayes_v2"
output = "test_v2_s42"
args = "repredict --model outputs/val_v2_s42/bayes_v2_seed42_model.pt --device cuda --split test --protocol configs/depletion_v2_protocol.toml"

