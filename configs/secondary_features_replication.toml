# Conditional replication: run only after the prespecified basis feature test passes.
# Both arms use34 static input positions: actual TRAIN-encoded values/masks or allzeros.
# New origins0and30 are explicit training tasks; older study numbers remain separate.
[experiment]
status = "development_only"
seeds = [43, 44, 45, 46]
prediction_seed = 2026
evaluation_bootstrap_seed = 42
origins_days = [0, 30, 60, 90, 180, 360, 720]
samples = 256
bootstrap_replicates = 200
static_features = "nonspatial_17"
static_availability_assumption = "Retrospective assumption: initial completion and preproduction geological attributes were available before first production; original measurement and revision timestamps remain unverified."
full_curve_evaluation = true
calibration = "identity"
selection_scope = "Original60/90/180/360/720incrementcells; secondary-only and day30 are separately reported tasks."
feature_support_rule = "Positive paired95percent group-bootstrap lower bound for WIS improvement over matchedzero arm; confirm promising findings with additional trainingseeds before claiming repeatability."
feature_replication_decision = "Prespecified basis_secondary versus basis_zero on original15incrementcells; other model/task comparisons are descriptive pairwise evidence, not an omnibus selection claim."

replication_of = "secondary_features_spark_001: basis actual-versus-zero, training seed42"
launch_condition = "Completed pilot paired95percent original15WIS feature-improvement interval has a positive lower bound."
fresh_seed_replication_rule = "On fixed new seeds43-46, original15 mean WIS feature-gain paired95percent group interval lower>0 with all500 valid replicates; report all per-seed signs. Combinedfive is descriptive after seed42-triggered continuation."

[[models]]
name = "basis_zero"
feature_variant = "zero"
covariate_preprocessing = "external"
kind = "conditional_rate"
rate_family = "basis"
basis_dictionary = "fast"
history_rate_features = "last_interval"
epochs = 60
hidden_width = 128
batch_size = 256
train_samples = 16
learning_rate = 0.001
history_dropout = 0.1
phase_dropout = 0.1
log_every = 10
device = "cpu"

[[models]]
name = "basis_secondary"
feature_variant = "actual"
covariate_preprocessing = "external"
kind = "conditional_rate"
rate_family = "basis"
basis_dictionary = "fast"
history_rate_features = "last_interval"
epochs = 60
hidden_width = 128
batch_size = 256
train_samples = 16
learning_rate = 0.001
history_dropout = 0.1
phase_dropout = 0.1
log_every = 10
device = "cpu"
